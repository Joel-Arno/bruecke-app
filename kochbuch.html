<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Kochbuch</title>
<meta name="description" content="Rezepte, Wochenplan, Einkaufsliste, Kochmodus und ein Küchen-Assistent – alles in einer Datei.">
<meta name="theme-color" content="#FBF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kochbuch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== Farben: hell ist Standard, dunkel folgt dem iPhone oder der Einstellung ===== */
  :root{
    --bg:#FBF8F3; --surface:#FFFDF8; --raised:#F2ECE0;
    --ink:#1A1815; --soft:#58513F; --muted:#8A8175; --faint:#A39A8C;
    --line:#EDE6D9; --line2:#E2DACC; --box:#D8CFC0;
    --accent:#A8452B; --on-accent:#FBF8F3;
    --solid:#1A1815; --on-solid:#FBF8F3;
    --shadow:0 10px 26px -20px rgba(26,24,21,0.8);
    --scrim:rgba(26,24,21,0.32);
  }
  html[data-theme="dark"]{
    --bg:#141210; --surface:#1E1A17; --raised:#241F1B;
    --ink:#F6F1E8; --soft:#D8D1C5; --muted:#8B8175; --faint:#6E655B;
    --line:#26221E; --line2:#34302B; --box:#3A342E;
    --accent:#F0A64B; --on-accent:#241A0C;
    --solid:#F0A64B; --on-solid:#241A0C;
    --shadow:0 10px 26px -20px rgba(0,0,0,0.9);
    --scrim:rgba(8,7,6,0.55);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea,select{ font:inherit; color:inherit; }
  button{ background:none; border:none; padding:0; cursor:pointer; }
  .serif{ font-family:'Instrument Serif',Georgia,serif; font-weight:400; }

  .app{ position:relative; height:100vh; height:100dvh; width:100vw; display:flex; flex-direction:column; overflow:hidden; }

  /* ===== Ansichten ===== */
  .views{ flex:1 1 auto; position:relative; overflow:hidden; }
  .view{ position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:none; }
  .view.on{ display:block; }
  .pad{ padding:0 22px; }
  .top{ padding:max(44px,env(safe-area-inset-top)) 22px 0; }
  .btm{ height:calc(26px + env(safe-area-inset-bottom)); }

  h1.title{ font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:34px; line-height:1.05; margin:0; }
  .kicker{ font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .sect{ font-family:'Instrument Serif',Georgia,serif; font-size:19px; margin:18px 0 10px; }
  .lbl{ font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin:16px 0 7px; }
  .muted{ color:var(--muted); font-size:13px; line-height:1.5; }
  .hint{ font-size:11.5px; color:var(--muted); line-height:1.45; }

  /* ===== Zeit als große Zahl ===== */
  .num{ text-align:right; flex:0 0 auto; }
  .num b{ display:block; font-size:22px; font-weight:600; letter-spacing:-.6px; color:var(--accent); line-height:1.05; }
  .num span{ display:block; font-size:9.5px; letter-spacing:.1em; color:var(--muted); margin-top:3px; }
  .num.plain b{ color:var(--ink); }

  /* ===== Zeilen und Karten ===== */
  .row{ display:flex; align-items:center; gap:15px; padding:14px 0; border-top:1px solid var(--line); width:100%; text-align:left; }
  .row:first-of-type{ border-top:none; }
  .row .grow{ flex:1; min-width:0; }
  .row .nm{ font-family:'Instrument Serif',Georgia,serif; font-size:20px; line-height:1.15; }
  .row .sub{ font-size:12.5px; color:var(--muted); margin-top:5px; }
  .rows{ border-bottom:1px solid var(--line); }
  .rows .row:first-child{ border-top:1px solid var(--line); }

  .thumb{ width:62px; height:62px; border-radius:3px; flex:0 0 62px; display:flex; align-items:center; justify-content:center; background-size:cover; background-position:center; position:relative; }
  .thumb .mine{ position:absolute; top:5px; left:5px; background:var(--surface); color:var(--ink); font-size:9px; letter-spacing:.08em; padding:3px 6px; border-radius:4px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }

  /* ===== Knöpfe ===== */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:46px; padding:0 18px; border-radius:23px; border:1px solid var(--line2); background:transparent; color:var(--ink); font-size:14.5px; font-weight:500; }
  .btn:active{ transform:translateY(1px); }
  .btn.solid{ background:var(--solid); color:var(--on-solid); border-color:var(--solid); }
  .btn.accent{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .btn.big{ height:54px; border-radius:27px; font-size:16px; }
  .btn.wide{ width:100%; }
  .btn.sm{ height:38px; font-size:13.5px; padding:0 15px; }
  .btn[disabled]{ opacity:.45; }
  .btn.ghost{ border-color:transparent; color:var(--accent); }
  .icon-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line2); display:flex; align-items:center; justify-content:center; flex:0 0 36px; }
  .icon-btn.solid{ background:var(--solid); border-color:var(--solid); color:var(--on-solid); }

  .chip{ flex:0 0 auto; border:1px solid var(--line2); border-radius:18px; padding:8px 14px; font-size:13.5px; color:var(--soft); white-space:nowrap; }
  .chip.on{ background:var(--solid); border-color:var(--solid); color:var(--on-solid); }
  .chips{ display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .chips::-webkit-scrollbar{ display:none; }
  .chips.wrap{ flex-wrap:wrap; overflow:visible; }

  .tabs{ display:flex; gap:20px; font-size:14px; color:var(--muted); margin-top:14px; }
  .tabs button{ padding-bottom:4px; display:flex; align-items:center; gap:6px; color:inherit; }
  .tabs button.on{ color:var(--ink); font-weight:500; border-bottom:1.5px solid var(--accent); }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; }

  /* ===== Formularfelder ===== */
  .field{ width:100%; height:46px; border-radius:23px; border:1px solid var(--line2); background:transparent; padding:0 18px; font-size:15px; outline:none; }
  .field:focus{ border-color:var(--accent); }
  textarea.field{ height:auto; min-height:110px; border-radius:16px; padding:14px 16px; line-height:1.5; resize:vertical; }
  .field::placeholder{ color:var(--faint); }
  .line-field{ width:100%; border:none; border-bottom:1px solid var(--line2); background:transparent; padding:10px 0; font-size:16px; outline:none; }
  .line-field:focus{ border-color:var(--accent); }

  /* ===== Tab-Leiste + Schwebeknopf ===== */
  .tabbar{ flex:0 0 auto; display:flex; border-top:1px solid var(--line2); background:var(--bg); padding:11px 8px calc(14px + env(safe-area-inset-bottom)); }
  .tabbar button{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; min-height:44px; color:var(--faint); font-size:10.5px; }
  .tabbar button.on{ color:var(--accent); font-weight:500; }
  .fab{ position:absolute; right:18px; bottom:calc(96px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:28px; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px -8px rgba(0,0,0,.45); z-index:30; }
  .fab.hide{ display:none; }

  /* ===== Flächen von unten ===== */
  .scrim{ position:fixed; inset:0; background:var(--scrim); z-index:90; display:none; }
  .scrim.on{ display:block; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; max-height:88vh; background:var(--bg); border-radius:22px 22px 0 0; z-index:91; display:none; flex-direction:column; box-shadow:0 -10px 30px -12px rgba(0,0,0,.45); }
  .sheet.on{ display:flex; }
  .grip{ width:38px; height:4px; border-radius:2px; background:var(--box); margin:10px auto 4px; }
  .sheet-head{ padding:8px 22px 14px; display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--line); }
  .sheet-head .serif{ font-size:23px; }
  .sheet-body{ flex:1; overflow-y:auto; padding:16px 22px; }
  .sheet-foot{ padding:12px 22px calc(24px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }

  /* ===== Kochmodus ===== */
  .cook{ position:fixed; inset:0; z-index:80; background:var(--bg); display:none; flex-direction:column; padding:max(44px,env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); }
  .cook.on{ display:flex; }
  .cook-step{ font-family:'Instrument Serif',Georgia,serif; font-size:clamp(23px,6.4vw,29px); line-height:1.32; }
  .plan-bar{ display:flex; gap:3px; }
  .plan-bar i{ height:6px; border-radius:3px; background:var(--line); display:block; }
  .timer-box{ display:flex; align-items:center; gap:14px; background:var(--raised); border-radius:16px; padding:14px 16px; margin-top:22px; }
  .timer-box .t{ font-size:26px; font-weight:600; letter-spacing:-.5px; line-height:1.05; }

  /* ===== Kleinkram ===== */
  .toast{ position:fixed; left:50%; bottom:calc(112px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(12px); background:var(--solid); color:var(--on-solid); padding:11px 18px; border-radius:22px; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:99; max-width:84vw; text-align:center; }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  .empty{ text-align:center; padding:44px 22px; color:var(--muted); font-size:14px; line-height:1.6; }
  .check{ width:19px; height:19px; border-radius:6px; border:1.5px solid var(--box); flex:0 0 19px; display:flex; align-items:center; justify-content:center; color:transparent; }
  .check.on{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .strike{ text-decoration:line-through; color:var(--faint); }
  .bar{ height:4px; border-radius:2px; background:var(--line2); overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--accent); }
  .msg{ max-width:88%; font-size:15px; line-height:1.6; }
  .msg.me{ align-self:flex-end; background:var(--solid); color:var(--on-solid); padding:11px 15px; border-radius:17px 17px 4px 17px; font-size:14.5px; line-height:1.45; }
  .msg b{ font-weight:600; }
  .act{ display:flex; align-items:center; gap:11px; background:var(--raised); border-radius:12px; padding:12px 14px; width:100%; text-align:left; font-size:13.5px; }
  .spin{ display:inline-block; width:14px; height:14px; border:2px solid var(--line2); border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="app">
  <div class="views">
    <div class="view on" id="vHeute"></div>
    <div class="view" id="vRezepte"></div>
    <div class="view" id="vRezept"></div>
    <div class="view" id="vLernen"></div>
    <div class="view" id="vLektion"></div>
    <div class="view" id="vKueche"></div>
    <div class="view" id="vNeu"></div>
  </div>

  <button class="fab" id="fab" onclick="openAssistant()" aria-label="Assistent">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5l2.1 5.4 5.4 2.1-5.4 2.1L12 18.5l-2.1-5.4L4.5 11l5.4-2.1z"/></svg>
  </button>

  <div class="tabbar" id="tabbar"></div>
</div>

<!-- Kochmodus -->
<div class="cook" id="cook">
  <div id="cookHead"></div>
  <div id="cookPlan"></div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; overflow-y:auto; padding:20px 0;">
    <div class="cook-step" id="cookStep"></div>
    <div id="cookTimer"></div>
  </div>
  <div id="cookFoot"></div>
</div>

<!-- Fläche von unten (Assistent, Filter, Einstellungen, Timer …) -->
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sheet-head" id="sheetHead"></div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot" style="display:none;"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<input type="file" id="jsonPick" accept="application/json,.json" hidden>

<script>
/* ==========================================================================
   DATEN – Rezepte, Tipps, Kurse und Küchenwissen
   ========================================================================== */
const RECIPES = [
{
  id:'aglio', name:'Spaghetti Aglio e Olio', emoji:'🍝', cat:'Pasta', minutes:20, level:'Einfach',
  base:2, diet:'vegan', tags:['Feierabend','5 Zutaten','Vorratskammer'],
  desc:'Das schnellste gute Essen der Welt. Steht und fällt mit einer Sache: Der Knoblauch darf goldgelb werden, niemals braun.',
  ings:[
    {q:200,u:'g',n:'Spaghetti'},
    {q:4,u:'Zehen',n:'Knoblauch',note:'in feine Scheiben geschnitten'},
    {q:6,u:'EL',n:'Olivenöl'},
    {q:1,u:'',n:'getrocknete Chilischote',note:'oder ½ TL Chiliflocken'},
    {q:1,u:'Bund',n:'Petersilie',note:'glatt, fein gehackt'},
    {q:1,u:'Prise',n:'Salz',fix:true},
    {q:1,u:'Prise',n:'schwarzer Pfeffer',fix:true}
  ],
  steps:[
    {t:'Reichlich Wasser aufsetzen und kräftig salzen – es soll nach Meerwasser schmecken. Spaghetti nach Packung al dente kochen.',timer:9},
    {t:'Währenddessen Olivenöl in einer großen Pfanne bei mittlerer Hitze erwärmen. Knoblauchscheiben und zerbröselte Chili hineingeben.'},
    {t:'Knoblauch langsam ziehen lassen, bis er hellgolden ist – etwa 3 Minuten. Sobald er bräunt, wird er bitter: dann Pfanne sofort vom Herd ziehen.',timer:3},
    {t:'Eine Tasse Nudelwasser abschöpfen, bevor du die Pasta abgießt.'},
    {t:'Spaghetti in die Pfanne geben, 4–5 EL Nudelwasser dazu und alles bei hoher Hitze 30 Sekunden schwenken, bis die Sauce cremig an den Nudeln hängt.'},
    {t:'Petersilie unterheben, mit Salz und Pfeffer abschmecken und sofort servieren.'}
  ],
  tips:['Das stärkehaltige Nudelwasser ist die eigentliche Sauce – ohne es bleibt das Öl separat und die Pasta wirkt fettig.']
},
{
  id:'dal', name:'Rotes Linsen-Dal', emoji:'🥘', cat:'Eintopf', minutes:30, level:'Einfach',
  base:4, diet:'vegan', tags:['Meal Prep','Vorratskammer','Eintopf'],
  desc:'Ein Topf, kein Einweichen, fertig in einer halben Stunde. Rote Linsen zerfallen von selbst zu einer sämigen Suppe.',
  ings:[
    {q:250,u:'g',n:'rote Linsen',note:'kalt abgespült'},
    {q:1,u:'',n:'Zwiebel',note:'fein gewürfelt'},
    {q:3,u:'Zehen',n:'Knoblauch',note:'gehackt'},
    {q:20,u:'g',n:'Ingwer',note:'frisch, gerieben'},
    {q:2,u:'TL',n:'Kreuzkümmel, gemahlen'},
    {q:2,u:'TL',n:'Kurkuma'},
    {q:1,u:'TL',n:'Garam Masala'},
    {q:1,u:'Dose',n:'gehackte Tomaten',note:'400 g'},
    {q:400,u:'ml',n:'Kokosmilch'},
    {q:600,u:'ml',n:'Gemüsebrühe'},
    {q:2,u:'EL',n:'Öl',fix:true},
    {q:1,u:'',n:'Limette',note:'Saft davon'}
  ],
  steps:[
    {t:'Öl im Topf erhitzen. Zwiebel bei mittlerer Hitze 5 Minuten glasig dünsten, dann Knoblauch und Ingwer 1 Minute mitbraten.',timer:5},
    {t:'Kreuzkümmel, Kurkuma und Garam Masala dazugeben und 30 Sekunden im Fett rösten, bis es kräftig duftet. Das ist der Schritt, der aus Pulver Geschmack macht.'},
    {t:'Tomaten, Kokosmilch, Brühe und Linsen dazugeben, aufkochen, dann Hitze reduzieren.'},
    {t:'Offen 20 Minuten leise köcheln lassen, ab und zu umrühren, bis die Linsen zerfallen sind.',timer:20},
    {t:'Mit Limettensaft und Salz abschmecken. Die Säure ganz am Ende hebt das ganze Gericht.'}
  ],
  tips:['Dal wird über Nacht dicker. Beim Aufwärmen einfach einen Schluck Wasser oder Brühe einrühren.']
},
{
  id:'ofengemuese', name:'Ofengemüse mit Feta', emoji:'🫑', cat:'Ofen', minutes:45, level:'Einfach',
  base:3, diet:'veg', tags:['Ein Blech','Vegetarisch','Meal Prep'],
  desc:'Ein Blech, kaum Arbeit, viel Röstaroma. Der Trick ist Platz: Gemüse, das sich stapelt, dämpft statt zu rösten.',
  ings:[
    {q:400,u:'g',n:'Kartoffeln',note:'festkochend, in 2-cm-Würfeln'},
    {q:2,u:'',n:'Paprika',note:'in breite Streifen geschnitten'},
    {q:1,u:'',n:'Zucchini',note:'in dicke Halbmonde'},
    {q:1,u:'',n:'rote Zwiebel',note:'in Spalten'},
    {q:200,u:'g',n:'Kirschtomaten'},
    {q:200,u:'g',n:'Feta'},
    {q:4,u:'EL',n:'Olivenöl'},
    {q:2,u:'TL',n:'getrockneter Oregano'},
    {q:1,u:'TL',n:'geräuchertes Paprikapulver'}
  ],
  steps:[
    {t:'Ofen auf 210 °C Ober-/Unterhitze vorheizen (Umluft 190 °C). Blech mit Backpapier auslegen.'},
    {t:'Kartoffeln mit der Hälfte des Öls, Oregano, Paprikapulver und Salz mischen und mit Abstand auf dem Blech verteilen. 15 Minuten vorbacken – sie brauchen den Vorsprung.',timer:15},
    {t:'Paprika, Zucchini und Zwiebel mit dem restlichen Öl mischen, zum Blech geben und alles wieder auseinanderschieben. Weitere 15 Minuten backen.',timer:15},
    {t:'Tomaten dazugeben, Feta in groben Stücken darüberbröseln. Nochmals 10 Minuten backen, bis der Feta Farbe nimmt.',timer:10},
    {t:'Mit Pfeffer und einem Spritzer Zitrone servieren.'}

  tips:['Lieber zwei Bleche als eins zu voll. Auf einem überladenen Blech entsteht Dampf, und Dampf verhindert Bräunung.']
},
{
  id:'ruehrei', name:'Cremiges Rührei', emoji:'🍳', cat:'Frühstück', minutes:10, level:'Einfach',
  base:2, diet:'veg', tags:['Frühstück','Technik','5 Zutaten'],
  desc:'Rührei wird nicht durch Zutaten besser, sondern durch niedrige Hitze und Geduld.',
  ings:[
    {q:4,u:'',n:'Eier'},
    {q:20,u:'g',n:'Butter'},
    {q:1,u:'EL',n:'Crème fraîche',note:'optional, für extra Cremigkeit'},
    {q:1,u:'Prise',n:'Salz',fix:true},
    {q:1,u:'Bund',n:'Schnittlauch',note:'in Röllchen'}

  steps:[

{

  base:4, diet:'veg', tags:['Herbst','Suppe','Meal Prep'],
  desc:'Hokkaido muss nicht geschält werden – das spart die halbe Arbeit und die Schale gibt Farbe.',
  ings:[
    {q:1,u:'',n:'Hokkaido-Kürbis',note:'ca. 1 kg, entkernt, gewürfelt'},
    {q:1,u:'',n:'Zwiebel',note:'gewürfelt'},
    {q:20,u:'g',n:'Ingwer',note:'gerieben'},
    {q:1,u:'',n:'Kartoffel',note:'mehligkochend, gewürfelt'},
    {q:800,u:'ml',n:'Gemüsebrühe'},
    {q:150,u:'ml',n:'Sahne',note:'oder Kokosmilch'},
    {q:2,u:'EL',n:'Öl',fix:true},

  steps:[
    {t:'Öl im großen Topf erhitzen, Zwiebel 5 Minuten anschwitzen, Ingwer kurz mitbraten.',timer:5},

    {t:'Mit Brühe ablöschen und dabei den Bratensatz vom Boden lösen. Aufkochen und 20 Minuten köcheln, bis alles weich ist.',timer:20},

      <p>Fast alle Anfänger halten das Messer zu weit hinten am Griff. Dadurch fehlt die Kontrolle über die Klingenspitze.</p>

    {id:'h1', title:'Die Maillard-Reaktion', mins:4, html:`
      <p>Alles, was gebraten, geröstet oder gebacken braun wird, verdankt seinen Geschmack derselben Reaktion: Aminosäuren und Zucker verbinden sich bei Hitze zu hunderten neuen Aromastoffen.</p>

    {id:'h3', title:'Carry-over und Ruhezeit', mins:3, html:`

    {id:'w1', title:'Salz ist Werkzeug, nicht Gewürz', mins:4, html:`
      <p>Salz macht Essen nicht nur salziger. Es unterdrückt Bitterkeit, verstärkt Süße und lässt vorhandene Aromen überhaupt erst hervortreten.</p>

    {id:'w2', title:'Die fünf Stellschrauben', mins:4, html:`

{

  lessons:[
    {id:'s1', title:'Reduzieren und Emulgieren', mins:4, html:`
      <h4>Reduktion</h4>
      <p>Die einfachste Bindung: Flüssigkeit offen einkochen. Wasser verdampft, Geschmack und Gelatine bleiben zurück. Braucht keine Zutat, nur Zeit – und einen offenen Topf, denn mit Deckel passiert nichts.</p>
      <h4>Emulsion</h4>
      <p>Fett und Wasser mischen sich nicht von allein. Ein Emulgator hält sie zusammen: Eigelb (Mayonnaise, Hollandaise), Senf (Vinaigrette) oder Stärke (Pastasauce).</p>
      <ul>
        <li><b>Vinaigrette:</b> Essig, Salz und Senf verrühren, dann Öl langsam einlaufen lassen.</li>
        <li><b>Pastasauce:</b> stärkehaltiges Nudelwasser + Fett + Bewegung in der Pfanne.</li>
        <li><b>Butter montieren:</b> kalte Butterwürfel außerhalb der starken Hitze einrühren.</li>
      </ul>
      <p>Eine gebrochene Emulsion lässt sich oft retten: neues Eigelb oder einen Löffel warmes Wasser in eine saubere Schüssel geben und die gebrochene Sauce tropfenweise einrühren.</p>`},
    {id:'s2', title:'Mehlschwitze und Stärke', mins:4, html:`
      <h4>Mehlschwitze (Roux)</h4>
      <p>Gleiche Teile Butter und Mehl, bei mittlerer Hitze verrührt. Je länger sie gart, desto nussiger der Geschmack und desto schwächer die Bindekraft.</p>
      <ul>
        <li><b>Hell</b> (2 Min.) – Béchamel, helle Saucen.</li>
        <li><b>Blond</b> (5 Min.) – Velouté, Ragouts.</li>
        <li><b>Braun</b> (10+ Min.) – dunkle Saucen, Gumbo.</li>
      </ul>
      <p><b>Gegen Klumpen:</b> heiße Flüssigkeit in die heiße Roux oder kalte in die kalte – gleiche Temperaturen sind der Trick. Und in kleinen Mengen zugeben, jedes Mal glattrühren.</p>
      <h4>Stärke separat anrühren</h4>
      <p>Speisestärke immer erst mit kaltem Wasser zu einer Aufschlämmung verrühren, dann in die kochende Flüssigkeit gießen. Direkt eingestreut verklumpt sie sofort.</p>
      <p>Stärkebindung wird beim Abkühlen fester – lieber etwas dünner lassen als zu dick.</p>`}

{
  id:'teig', name:'Teig & Backen', ic:'🥐',
  desc:'Warum Backen genauer ist als Kochen – und welche vier Faktoren wirklich zählen.',
  lessons:[
    {id:'t1', title:'Gluten verstehen', mins:4, html:`
      <p>Mehl plus Wasser plus Bewegung ergibt Gluten – ein Netz aus Eiweißen, das Gas festhält und Teig elastisch macht. Ob das erwünscht ist, hängt vom Gebäck ab.</p>
      <h4>Viel Gluten wollen wir bei</h4>
      <ul><li>Brot, Pizza, Nudelteig – kneten, kneten, kneten.</li></ul>
      <h4>Wenig Gluten wollen wir bei</h4>
      <ul><li>Kuchen, Muffins, Mürbeteig, Pfannkuchen – nur bis zur Vermischung rühren.</li></ul>
      <h4>Mehltypen</h4>
      <p>Die Typenzahl gibt den Mineralstoffgehalt an, nicht die Backstärke: 405 fein und hell für Kuchen, 550 der Allrounder für Brot und Pizza, 1050 kräftiger und dunkler. Vollkorn bindet mehr Wasser – hier braucht der Teig deutlich mehr Flüssigkeit.</p>
      <h4>Autolyse</h4>
      <p>Mehl und Wasser 30 Minuten stehen lassen, bevor Salz und Hefe dazukommen. Das Gluten bildet sich von allein und der Teig lässt sich danach viel leichter verarbeiten.</p>`},
    {id:'t2', title:'Triebmittel', mins:4, html:`
      <h4>Hefe – biologisch</h4>
      <p>Lebende Organismen, die Zucker zu CO₂ und Alkohol vergären. Braucht Zeit und Wärme. <b>Weniger Hefe plus mehr Zeit</b> ergibt immer mehr Geschmack als umgekehrt. Über 50 °C stirbt sie ab, im Kühlschrank arbeitet sie langsam weiter – das nutzt man für die kalte Gare über Nacht.</p>
      <h4>Backpulver – chemisch, doppelt wirkend</h4>
      <p>Enthält Natron plus eine trockene Säure. Reagiert einmal mit Feuchtigkeit und einmal mit Hitze. Deshalb kann man Rührteig kurz stehen lassen, ohne alles zu verlieren.</p>
      <h4>Natron – chemisch, braucht Säure</h4>
      <p>Reagiert nur mit einer sauren Zutat im Teig: Buttermilch, Joghurt, Essig, Zitrone, Kakao. Fehlt die Säure, bleibt der Teig flach und schmeckt seifig. Reagiert sofort – solche Teige kommen zügig in den Ofen.</p>
      <h4>Mechanisch</h4>
      <p>Aufgeschlagene Eier oder Sahne bringen Luft ein, etwa im Biskuit. Diese Luft wird beim Unterheben zerstört, wenn man rührt statt zu heben.</p>`},
    {id:'t3', title:'Ofen und Temperatur', mins:3, html:`
      <h4>Umluft oder Ober-/Unterhitze</h4>

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    ['favs','shopping','pantry','own','cooked'].forEach(k => { if(Array.isArray(d[k])) store[k] = d[k]; });
    ['plan','progress'].forEach(k => { if(d[k] && typeof d[k] === 'object') store[k] = d[k]; });
    if(d.settings) Object.assign(store.settings, d.settings);
  }catch(e){ /* beschädigter Speicher: mit Standardwerten weiter */ }
}

let saveWarned = false;
function save(count){
  if(count) store.settings.sinceBackup = (store.settings.sinceBackup || 0) + 1;
  try{
    localStorage.setItem(KEY, JSON.stringify(store));
  }catch(e){
    // Voll (meist durch Fotos) – einmal ehrlich sagen statt still zu verlieren
    if(!saveWarned){
      saveWarned = true;
      toast('Speicher voll – lösch ein Rezeptfoto oder sichere und setze zurück');
    }
  }
}

/* Mengen auf die gewählte Portionszahl umrechnen */
const BRUCH = {0.25:'¼', 0.33:'⅓', 0.5:'½', 0.66:'⅔', 0.75:'¾'};
function zahl(n){
  if(!isFinite(n)) return '';
  const ganz = Math.floor(n), rest = Math.round((n - ganz) * 100) / 100;
  for(const k in BRUCH) if(Math.abs(rest - parseFloat(k)) < 0.06) return (ganz ? ganz : '') + BRUCH[k];
  if(rest === 0) return String(ganz);
  return String(Math.round(n * 10) / 10).replace('.', ',');
}
function mengeFuer(ing, faktor){
  if(ing.fix || !ing.q) return zahl(ing.q || 0);
  const v = ing.q * faktor, gewogen = ['g','ml','kg','l'].includes(ing.u);
  let r;
  if(gewogen) r = v >= 100 ? Math.round(v / 10) * 10 : v >= 20 ? Math.round(v / 5) * 5 : Math.round(v);
  else r = Math.round(v * 4) / 4;
  return zahl(r);
}
function zutatZeile(ing, faktor){
  const q = mengeFuer(ing, faktor);
  return (q ? q + ' ' : '') + (ing.u || '');
}

/* Vorrat: wie viele Zutaten eines Rezepts sind da? */
function vorratTreffer(r){
  if(!store.pantry.length) return 0;
  const p = store.pantry.map(x => x.toLowerCase());
  return r.ings.filter(i => {
    const n = i.n.toLowerCase();
    return p.some(x => n.includes(x) || x.includes(n.split(',')[0].trim()));
  }).length;
}
function fehlend(r){ return Math.max(0, r.ings.length - vorratTreffer(r)); }

/* ==========================================================================
   TIMER
   ========================================================================== */
let timers = [];
let tick = null;
let audio = null;

function pling(){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, .28, .56].forEach(d => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.connect(g); g.connect(audio.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(.0001, audio.currentTime + d);
      g.gain.exponentialRampToValueAtTime(.25, audio.currentTime + d + .02);
      g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d + .2);
      o.start(audio.currentTime + d); o.stop(audio.currentTime + d + .22);
    });
  }catch(e){ /* ohne Ton geht es auch */ }
}

function timerStart(minuten, label, rezeptId){
  timers.push({ id: uid(), label: label || (minuten + ' Minuten'), rezeptId: rezeptId || null, ende: Date.now() + minuten * 60000, fertig: false });
  if(!tick) tick = setInterval(timerTick, 500);
  toast('Timer läuft: ' + minuten + ' Min');
  renderCook();
}
function timerStop(id){ timers = timers.filter(t => t.id !== id); renderCook(); }
function timerTick(){
  let etwas = false;
  timers.forEach(t => {
    if(!t.fertig && Date.now() >= t.ende){
      t.fertig = true; etwas = true;
      toast('⏰ ' + t.label + ' ist fertig');
      pling();
      if(navigator.vibrate) navigator.vibrate([300,120,300]);
    }
  });
  if($('cook').classList.contains('on')) renderCookTimer();
  if(!timers.length){ clearInterval(tick); tick = null; }
  if(etwas) renderCook();
}
function restZeit(t){
  const s = Math.max(0, Math.round((t.ende - Date.now()) / 1000));
  return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
}

function gefilterteRezepte(){
  const f = state.filter, q = state.suche.trim().toLowerCase();
  let list = alleRezepte();

  if(f.nurEigene) list = list.filter(r => r.eigen);
  if(f.nurFavs) list = list.filter(r => store.favs.includes(r.id));
  if(f.nurVorrat) list = list.filter(r => vorratTreffer(r) > 0);
  if(f.basis) list = list.filter(r => meta(r).basis === f.basis);
  if(f.aufwand) list = list.filter(r => meta(r).aufwand === f.aufwand);
  if(f.zeit) list = list.filter(r => r.minutes <= f.zeit);
  if(f.anlass) list = list.filter(r => (meta(r).anlass || []).includes(f.anlass));
  if(f.preis) list = list.filter(r => meta(r).preis === f.preis);

  if(q) list = list.filter(r =>
    r.name.toLowerCase().includes(q) ||
    (r.desc || '').toLowerCase().includes(q) ||
    meta(r).basis.toLowerCase().includes(q) ||
    r.ings.some(i => i.n.toLowerCase().includes(q)) ||
    (r.tags || []).some(t => t.toLowerCase().includes(q)));

  const sortiert = {
    zeit:   (a, b) => a.minutes - b.minutes,
    preis:  (a, b) => meta(a).preis - meta(b).preis || a.minutes - b.minutes,
    vorrat: (a, b) => (vorratTreffer(b) / b.ings.length) - (vorratTreffer(a) / a.ings.length),
    zuletzt:(a, b) => (store.cooked.findIndex(c => c.id === a.id) + 99) % 999 - (store.cooked.findIndex(c => c.id === b.id) + 99) % 999
  }[state.filter.sort] || ((a, b) => a.minutes - b.minutes);

  return list.sort(sortiert);
}

function aktiveFilter(){
  const f = state.filter;
  return [f.basis, f.aufwand, f.zeit, f.anlass, f.preis].filter(Boolean).length;
}

/* ==========================================================================
   KOCHMODUS
   ========================================================================== */
let cook = null;          // {teile:[{id, idx}], aktiv:0, start:Date}
let wakeLock = null;
let hoeren = null;

function kochenStarten(id){
  const r = rez(id);
  if(!r) return;
  cook = { teile: [{ id, idx: 0 }], aktiv: 0, start: Date.now() };
  state.rezeptId = id;
  if(!state.portionen) state.portionen = r.base;
  $('cook').classList.add('on');
  wachHalten();
  hoerenStart();
  renderCook();
}

function kochenBeenden(){
  const fertig = cook && cook.teile.map(t => t.id);
  $('cook').classList.remove('on');
  wachLoslassen();
  hoerenStop();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  (fertig || []).forEach(id => {
    store.cooked = [{ id, at: Date.now() }].concat(store.cooked.filter(c => c.id !== id)).slice(0, 12);
  });
  cook = null;
  save(true);
  toast('Guten Appetit!');
  setTab(state.tab);
}

async function wachHalten(){
  if(!store.settings.awake || !('wakeLock' in navigator)) return;
  try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){ /* abgelehnt – egal */ }
}
function wachLoslassen(){ if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; } }

function vorlesen(text){
  if(!store.settings.speak || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = .95;
  speechSynthesis.speak(u);
}

/* Sprachbefehle „weiter“ und „zurück“ */
function hoerenStart(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!store.settings.voice || !SR) return;
  try{
    hoeren = new SR();
    hoeren.lang = 'de-DE'; hoeren.continuous = true; hoeren.interimResults = false;
    hoeren.onresult = e => {
      const t = (e.results[e.results.length - 1][0].transcript || '').toLowerCase();
      if(/\b(weiter|nächster|naechster|next)\b/.test(t)) cookNext();
      else if(/\b(zurück|zurueck|vorheriger)\b/.test(t)) cookPrev();
    };
    hoeren.onend = () => { if(cook && store.settings.voice){ try{ hoeren.start(); }catch(e){} } };
    hoeren.start();
  }catch(e){ hoeren = null; }
}
function hoerenStop(){ if(hoeren){ try{ hoeren.onend = null; hoeren.stop(); }catch(e){} hoeren = null; } }

function aktivesTeil(){ return cook ? cook.teile[cook.aktiv] : null; }
function kurzName(n){ return n.length > 18 ? n.slice(0, 17).trim() + '…' : n; }

function renderCook(){

    ${store.settings.voice ? `<div style="display:flex; align-items:center; justify-content:center; gap:7px; margin-bottom:14px; font-size:12px; color:var(--muted);">

      Sag „weiter“ oder „zurück“</div>` : ''}
    <div style="display:flex; gap:10px;">
      <button class="icon-btn" style="width:54px; height:54px; flex:0 0 54px; border-radius:27px;" onclick="cookPrev()" aria-label="Zurück">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>

function renderCookTimer(){
  if(!cook) return;
  const teil = aktivesTeil(), r = rez(teil.id), s = r.steps[teil.idx];
  const lauf = timers.find(t => t.rezeptId === r.id && !t.fertig);
  const fertig = timers.find(t => t.rezeptId === r.id && t.fertig);
  const box = $('cookTimer');
  if(fertig){
    box.innerHTML = `<div class="timer-box" style="background:var(--accent); color:var(--on-accent);">
      <div style="flex:1;"><div class="t">Fertig</div><div style="font-size:11.5px; margin-top:4px; opacity:.8;">${esc(fertig.label)}</div></div>
      <button class="btn sm" style="border-color:currentColor;" onclick="timerStop('${fertig.id}')">Ok</button></div>`;
  }else if(lauf){
    box.innerHTML = `<div class="timer-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4.2l2.6 1.6M9.5 3h5"/></svg>

function fertigUm(){
  if(!cook) return '';
  let rest = 0;
  cook.teile.forEach(t => {
    const r = rez(t.id);
    rest = Math.max(rest, r.steps.slice(t.idx).reduce((s, st) => s + (st.timer || 2), 0));
  });
  const d = new Date(Date.now() + rest * 60000);
  return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}

function cookNext(){
  const teil = aktivesTeil(), r = rez(teil.id);
  if(teil.idx >= r.steps.length - 1){
    if(cook.teile.length > 1){
      const anderer = cook.teile.findIndex((t, i) => i !== cook.aktiv && t.idx < rez(t.id).steps.length - 1);
      if(anderer >= 0){ cook.teile.splice(cook.aktiv, 1); cook.aktiv = 0; renderCook(); return; }
    }
    kochenBeenden();
    return;
  }
  teil.idx++;
  renderCook();
}
function cookPrev(){ const t = aktivesTeil(); if(t.idx > 0){ t.idx--; renderCook(); } }
function cookWechsel(i){ cook.aktiv = i; renderCook(); }

/* ==========================================================================
   EINKAUFSLISTE
   Freier Text wird zerlegt, einer Abteilung zugeordnet und mit vorhandenen
   Einträgen zusammengefasst. Unbekanntes ordnet die KI ein, falls vorhanden.
   ========================================================================== */
function abteilungFuer(name){
  const n = ' ' + name.toLowerCase() + ' ';
  for(const ab of ABTEILUNGEN){
    const worte = ABTEILUNG_WORTE[ab] || [];
    if(worte.some(w => n.includes(w))) return ab;
  }
  return null;
}

function zerlegeEingabe(text){
  return text.split(/[,\n;]+/).map(t => t.trim()).filter(Boolean).map(teil => {
    const m = teil.match(MENGEN_RE);
    if(m){
      const name = m[3].trim();
      return { name, qty: (m[1] + (m[2] ? ' ' + m[2] : '')).trim() };
    }
    return { name: teil, qty: '' };
  });
}

function einkaufHinzu(text, quelle){
  const teile = zerlegeEingabe(text);
  let unbekannt = [];
  teile.forEach(t => {
    const dep = abteilungFuer(t.name);
    const vorhanden = store.shopping.find(s => !s.done && s.txt.toLowerCase() === t.name.toLowerCase());
    if(vorhanden){
      vorhanden.qty = mengeZusammen(vorhanden.qty, t.qty);
      if(quelle && vorhanden.from && !vorhanden.from.includes(quelle)) vorhanden.from += ' + ' + quelle;
    }else{
      const eintrag = { id: uid(), txt: t.name, qty: t.qty, dep: dep || 'Sonstiges', done: false, from: quelle || '', neu: true };
      store.shopping.push(eintrag);
      if(!dep) unbekannt.push(eintrag);
    }
  });
  save(true);
  if(unbekannt.length && store.settings.apiKey) einordnenMitKI(unbekannt);
  return teile.length;
}

/* Mengen zusammenzählen, wenn die Einheit gleich ist – sonst nebeneinander stehen lassen */
function mengeZusammen(a, b){
  if(!a) return b; if(!b) return a;
  const pa = a.match(/^([\d.,]+)\s*(.*)$/), pb = b.match(/^([\d.,]+)\s*(.*)$/);
  if(pa && pb && pa[2].toLowerCase() === pb[2].toLowerCase()){
    const sum = parseFloat(pa[1].replace(',', '.')) + parseFloat(pb[1].replace(',', '.'));
    return zahl(sum) + (pa[2] ? ' ' + pa[2] : '');
  }
  return a + ' + ' + b;
}

async function einordnenMitKI(eintraege){
  try{
    const namen = eintraege.map(e => e.txt);
    const antwort = await kiFrage(
      'Ordne jeden Einkaufsartikel genau einer dieser Abteilungen zu: ' + ABTEILUNGEN.join(', ') +
      '. Antworte ausschließlich als JSON-Objekt {"Artikel":"Abteilung"} ohne weiteren Text.\n\nArtikel: ' + namen.join(', '),
      null, 300);
    const j = JSON.parse((antwort.match(/\{[\s\S]*\}/) || ['{}'])[0]);
    let geaendert = false;
    eintraege.forEach(e => {
      const ab = j[e.txt];
      if(ab && ABTEILUNGEN.includes(ab)){ e.dep = ab; geaendert = true; }
    });
    if(geaendert){ save(); if(state.tab === 'kueche') renderKueche(); }
  }catch(e){ /* bleibt unter Sonstiges – kein Drama */ }
}

function aufEinkaufsliste(id){
  const r = rez(id);
  if(!r) return;
  const faktor = (state.rezeptId === id ? state.portionen : r.base) / r.base;
  r.ings.forEach(i => {
    const name = i.n.split(',')[0].trim();
    const vorhanden = store.shopping.find(s => !s.done && s.txt.toLowerCase() === name.toLowerCase());
    const menge = zutatZeile(i, faktor).trim();
    if(vorhanden){
      vorhanden.qty = mengeZusammen(vorhanden.qty, menge);
      if(!vorhanden.from.includes(r.name)) vorhanden.from = (vorhanden.from ? vorhanden.from + ' + ' : '') + r.name;
    }else{
      store.shopping.push({ id: uid(), txt: name, qty: menge, dep: abteilungFuer(name) || 'Sonstiges', done: false, from: r.name });
    }
  });
  save(true);
  renderTabbar();
  toast(r.ings.length + ' Zutaten auf der Einkaufsliste');
}

/* ==========================================================================
   KI-ANBINDUNG
   Eigener Anthropic-Schlüssel, direkt aus dem Browser. Ohne Schlüssel wirft
   die Funktion – jede Aufrufstelle hat einen Weg ohne KI.
   ========================================================================== */
async function kiFrage(text, bilder, maxTokens, system){
  const key = store.settings.apiKey;
  if(!key) throw new Error('kein Schlüssel');
  const inhalt = [];
  (bilder || []).forEach(b => inhalt.push({
    type: 'image',
    source: { type:'base64', media_type: b.typ || 'image/jpeg', data: b.data }
  }));
  inhalt.push({ type:'text', text });

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-5',
      max_tokens: maxTokens || 1400,
      system: system || 'Du hilfst in einer deutschsprachigen Koch-App. Antworte auf Deutsch, knapp und praktisch.',
      messages: [{ role:'user', content: inhalt }]
    })
  });
  if(!res.ok){
    throw new Error(res.status === 401 ? 'Schlüssel wird abgelehnt'
      : res.status === 429 ? 'Zu viele Anfragen'
      : res.status === 400 ? 'Anfrage abgelehnt'
      : 'Fehler ' + res.status);
  }
  const d = await res.json();
  return (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
}

/* Bild verkleinern, damit der Speicher nicht vollläuft */
function bildVerkleinern(file, maxKante, qualitaet){
  return new Promise((ok, fail) => {
    const leser = new FileReader();
    leser.onerror = () => fail(new Error('Bild nicht lesbar'));
    leser.onload = () => {
      const img = new Image();
      img.onerror = () => fail(new Error('Bild nicht lesbar'));
      img.onload = () => {
        const m = maxKante || 900;
        const f = Math.min(1, m / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * f);
        c.height = Math.round(img.height * f);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', qualitaet || 0.72));
      };
      img.src = leser.result;
    };
    leser.readAsDataURL(file);
  });
}

function entwurfSetz(feld, wert){
  formLesen();
  entwurf[feld] = wert;

function formLesen(){
  const g = id => { const x = $(id); return x ? x.value : ''; };
  entwurf.name = g('fName').trim() || entwurf.name;
  entwurf.minutes = Math.max(1, parseInt(g('fMin'), 10) || entwurf.minutes);
  entwurf.base = Math.max(1, parseInt(g('fPort'), 10) || entwurf.base);
  const zt = g('fZutaten');
  if(zt !== '') entwurf.ings = zt.split('\n').map(z => zutatAusText(z)).filter(Boolean);
  const st = g('fSchritte');
  if(st !== '') entwurf.steps = st.split('\n').map(s => s.trim()).filter(Boolean).map(t => ({ t, timer: timerAusText(t) }));
}

/* "250 g rote Linsen, gewürfelt" -> {q, u, n, note} */
function zutatAusText(zeile){
  const z = zeile.trim();
  if(!z) return null;
  const m = z.match(/^([\d.,]+)?\s*(kg|g|ml|l|EL|TL|Dosen|Dose|Bund|Zehen|Zehe|Prise|Stück|Packung|Handvoll)?\s*(.*)$/i);
  let rest = (m && m[3] ? m[3] : z).trim();
  let note = '';
  const komma = rest.indexOf(',');
  if(komma > 0){ note = rest.slice(komma + 1).trim(); rest = rest.slice(0, komma).trim(); }
  return {
    q: m && m[1] ? parseFloat(m[1].replace(',', '.')) : 0,
    u: m && m[2] ? m[2] : '',
    n: rest || z,
    note
  };
}
function timerAusText(t){
  const m = t.match(/(\d{1,3})\s*(?:–|-|bis)?\s*(\d{1,3})?\s*(?:min|minuten)/i);
  if(!m) return 0;
  return parseInt(m[2] || m[1], 10);
}

function entwurfSichern(){
  formLesen();
  if(!entwurf.name){ toast('Das Rezept braucht einen Namen'); return; }
  if(!entwurf.ings.length){ toast('Trag mindestens eine Zutat ein'); return; }
  if(!entwurf.steps.length){ toast('Trag mindestens einen Schritt ein'); return; }
  entwurf.eigen = true;
  entwurf.level = entwurf.aufwand === 'Projekt' ? 'Aufwendig' : entwurf.aufwand === 'konzentriert' ? 'Mittel' : 'Einfach';
  entwurf.cat = entwurf.basis;
  entwurf.tips = entwurf.tips || [];
  entwurf.tags = entwurf.tags || [];
  if(entwurf.id){
    const i = store.own.findIndex(r => r.id === entwurf.id);
    if(i >= 0) store.own[i] = entwurf; else store.own.push(entwurf);
  }else{
    entwurf.id = 'own-' + uid();
    store.own.push(entwurf);
  }
  save(true);
  const id = entwurf.id;
  entwurf = null;
  $('fab').classList.remove('hide');
  toast('Rezept gesichert');
  openRezept(id);
}

/* Erkennung ohne KI: Mengenzeilen sind Zutaten, längere Sätze sind Schritte */
function textZuRezept(txt){
  const e = leererEntwurf();
  const zeilen = txt.split('\n').map(z => z.trim()).filter(Boolean);
  let inSchritte = false;
  zeilen.forEach((z, i) => {
    if(i === 0 && z.length < 60 && !/^\d/.test(z)){ e.name = z.replace(/[:–-]\s*$/, ''); return; }
    if(/^(zubereitung|anleitung|so geht|schritte|und so)/i.test(z)){ inSchritte = true; return; }
    if(/^(zutaten|einkaufsliste)/i.test(z)){ inSchritte = false; return; }
    const port = z.match(/f[üu]r\s+(\d+)\s+(person|portion)/i);
    if(port){ e.base = parseInt(port[1], 10); return; }
    const min = z.match(/(\d{1,3})\s*min/i);
    const istZutat = /^[\d½¼¾]/.test(z) && z.length < 70;
    if(!inSchritte && istZutat){ e.ings.push(zutatAusText(z)); return; }
    if(z.length > 25 || inSchritte){
      e.steps.push({ t: z.replace(/^\d+[.)]\s*/, ''), timer: timerAusText(z) });
      inSchritte = true;
      if(min && !e.minutes) e.minutes = parseInt(min[1], 10);
    }
  });
  if(!e.name) e.name = 'Neues Rezept';
  const summe = e.steps.reduce((s, x) => s + (x.timer || 0), 0);
  if(summe) e.minutes = Math.max(10, Math.min(240, summe + 10));
  return e;
}

/* Gemeinsamer Weg für Text und Bild: KI liefert JSON, wir bauen den Entwurf */
async function kiRezept(auftrag, bilder){
  const antwort = await kiFrage(
    auftrag + '\n\nGib das Rezept als reines JSON zurück, ohne Erklärung und ohne Code-Zaun:\n' +
    '{"name":"","minutes":30,"base":4,"basis":"eines von: ' + BASIS_LIST.join('|') + '","aufwand":"nebenbei|konzentriert|Projekt","preis":1,' +
    '"ings":[{"q":250,"u":"g","n":"rote Linsen","note":"abgespült"}],"steps":[{"t":"Schritttext","timer":20}]}\n' +
    'timer ist die Minutenzahl, die in dem Schritt gewartet wird, sonst 0. q ist eine Zahl ohne Einheit. Behalte die Sprache des Originals bei, übersetze ins Deutsche wenn nötig.',
    bilder, 2500);
  const roh = (antwort.match(/\{[\s\S]*\}/) || [''])[0];
  const j = JSON.parse(roh);
  const e = leererEntwurf();
  e.name = String(j.name || 'Neues Rezept').slice(0, 80);
  e.minutes = Math.max(1, parseInt(j.minutes, 10) || 30);
  e.base = Math.max(1, parseInt(j.base, 10) || 2);
  e.basis = BASIS_LIST.includes(j.basis) ? j.basis : 'Gemüse';
  e.aufwand = AUFWAND_LIST.includes(j.aufwand) ? j.aufwand : 'nebenbei';
  e.preis = [1,2,3].includes(j.preis) ? j.preis : 1;
  e.ings = (j.ings || []).filter(i => i && i.n).map(i => ({
    q: parseFloat(i.q) || 0, u: String(i.u || ''), n: String(i.n), note: String(i.note || '')
  }));
  e.steps = (j.steps || []).filter(s => s && s.t).map(s => ({ t: String(s.t), timer: parseInt(s.timer, 10) || 0 }));
  if(!e.ings.length || !e.steps.length) throw new Error('Im Text stand kein vollständiges Rezept');
  return e;
}

function openLektion(kursId, lekId){

  const idx = c.lessons.indexOf(l);

  $('vLektion').innerHTML = `

      <button class="btn ghost sm" style="padding:0; color:var(--muted);" onclick="openKurs('${kursId}')">‹ ${esc(c.name)}</button>

      <button class="btn solid" style="flex:1;" onclick="lektionFertig('${kursId}','${lekId}',${next ? "'" + next.id + "'" : 'null'})">${next ? 'Gelesen · weiter' : 'Gelesen · zum Quiz'}</button>

function lektionFertig(kursId, lekId, nextId){
  const p = store.progress[kursId] || { lessons:[], best:0 };
  if(!p.lessons.includes(lekId)) p.lessons.push(lekId);
  store.progress[kursId] = p;
  save(true);
  if(nextId) openLektion(kursId, nextId); else quizStart(kursId);
}

function quizStart(kursId){
  state.quiz = { kurs: kursId, i: 0, score: 0, beantwortet: false };
  showView('vLektion');
  renderQuiz();
}
function renderQuiz(){
  const q = state.quiz, c = COURSES.find(x => x.id === q.kurs), f = c.quiz[q.i];
  $('vLektion').innerHTML = `
    <div class="top">
      <button class="btn ghost sm" style="padding:0; color:var(--muted);" onclick="openKurs('${q.kurs}')">‹ ${esc(c.name)}</button>
      <div class="kicker" style="margin-top:12px;">Frage ${q.i + 1} von ${c.quiz.length} · ${q.score} richtig</div>
      <div class="serif" style="font-size:23px; line-height:1.3; margin-top:10px;">${esc(f.q)}</div>
    </div>
    <div class="pad" style="padding-top:18px;">
      ${f.opts.map((o, i) => `<button class="card" id="opt${i}" style="width:100%; text-align:left; padding:14px 15px; margin-bottom:9px; font-size:14.5px; line-height:1.4;" onclick="quizAntwort(${i})">${esc(o)}</button>`).join('')}
      <div id="quizFb" style="display:none; margin-top:12px; padding:13px 15px; border-radius:12px; background:var(--raised); font-size:13.5px; line-height:1.55;"></div>
      <button class="btn solid wide big" id="quizNext" style="margin-top:14px; display:none;" onclick="quizWeiter()">Weiter</button>
    </div>
    <div class="btm"></div>`;
}
function quizAntwort(i){
  const q = state.quiz;
  if(q.beantwortet) return;
  q.beantwortet = true;
  const c = COURSES.find(x => x.id === q.kurs), f = c.quiz[q.i];
  const richtig = i === f.a;
  if(richtig) q.score++;
  f.opts.forEach((_, idx) => {
    const b = $('opt' + idx);
    if(idx === f.a) b.style.borderColor = 'var(--accent)';
    else if(idx === i) b.style.opacity = '.55';
  });
  const fb = $('quizFb');
  fb.innerHTML = (richtig ? '<b>Richtig.</b> ' : '<b>Nicht ganz.</b> ') + esc(f.fb);
  fb.style.display = 'block';
  $('quizNext').style.display = 'flex';
}
function quizWeiter(){
  const q = state.quiz, c = COURSES.find(x => x.id === q.kurs);
  if(q.i < c.quiz.length - 1){ q.i++; q.beantwortet = false; renderQuiz(); return; }
  const p = store.progress[q.kurs] || { lessons:[], best:0 };
  if(q.score > p.best) p.best = q.score;
  store.progress[q.kurs] = p;
  save(true);
  const voll = q.score === c.quiz.length;
  $('vLektion').innerHTML = `
    <div class="top"><h1 class="title" style="font-size:30px;">${q.score} von ${c.quiz.length} richtig</h1></div>
    <div class="pad" style="padding-top:12px;">
      <div class="muted">${voll ? 'Alles gesessen.' : 'Die Lektionen erklären genau diese Punkte – ein zweiter Durchgang lohnt sich.'}</div>
      <div style="display:flex; gap:9px; margin-top:20px;">
        <button class="btn" style="flex:1;" onclick="openKurs('${q.kurs}')">Zum Kurs</button>
        <button class="btn solid" style="flex:1;" onclick="quizStart('${q.kurs}')">Nochmal</button>
      </div>
    </div>`;
  state.quiz = null;
}

/* ==========================================================================
   OFFLINE-WISSENSMASCHINE (aus der Vorgängerversion übernommen)
   ========================================================================== */
/* ---- Textwerkzeuge ---- */
function norm(s){
  return s.toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
}
function hasAny(t, arr){ return arr.some(w => t.includes(w)); }

/* Treffer am Wortanfang – fängt gebeugte Formen wie "zähem" ab. */
function hasWordStart(t, w){
  return new RegExp('(^|[^a-zäöüß])' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(t);
}

/* Schlüssel eines Wissenseintrags gegen den Text prüfen:
   ganzes Wort, oder – bei längeren Begriffen – Wortanfang für Beugungen.
   Verhindert, dass "Fleisch" den Schlüssel "ei" trifft. */
function matchKey(t, k){
  if(/\s/.test(k)) return t.includes(k);
  if(hasWord(t, k)) return true;
  return k.length >= 4 && hasWordStart(t, k);
}

/* Treffer nur an Wortgrenzen – sonst matcht "erzähl" auf "zäh". */
function hasWord(t, w){
  if(/\s/.test(w)) return t.includes(w);
  return new RegExp('(^|[^a-zäöüß])' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '([^a-zäöüß]|$)').test(t);
}

/* Alle bekannten Zutatennamen aus den Rezepten */
function ingredientVocab(){
  const set = new Set();
  alleRezepte().forEach(r => r.ings.forEach(i => {
    const base = i.n.toLowerCase().split(',')[0].trim();
    set.add(base);
    base.split(' ').forEach(w => { if(w.length > 4) set.add(w); });
  }));
  return [...set];
}

/* Umgangssprache auf die Namen aus den Rezepten abbilden */
const SYNONYMS = {
  'ei':'eier', 'tomate':'tomaten', 'kartoffel':'kartoffeln', 'nudeln':'spaghetti',
  'pasta':'spaghetti', 'huhn':'hähnchen', 'hühnchen':'hähnchen', 'hendl':'hähnchen',
  'zwiebeln':'zwiebel', 'möhre':'karotte', 'möhren':'karotte', 'karotten':'karotte',
  'bohnen':'kidneybohnen', 'linse':'linsen', 'käse':'feta', 'sahne':'sahne'
};

function findIngredients(text){
  const t = text.toLowerCase();
  const extra = Object.keys(SYNONYMS).filter(k => hasWord(t, k)).map(k => SYNONYMS[k]);
  const found = ingredientVocab().filter(v => t.includes(v)).concat(extra);
  // längere Treffer bevorzugen und Teilstrings entfernen ("tomaten" schluckt "tomate")
  return [...new Set(found)]
    .sort((a,b) => b.length - a.length)
    .filter((v,i,arr) => !arr.slice(0,i).some(x => x.includes(v)));
}

function recipesForIngredients(list){
  if(!list.length) return [];
  return alleRezepte().map(r => {
    const hits = r.ings.filter(i => list.some(v => i.n.toLowerCase().includes(v))).length;
    return {r, hits};
  }).filter(x => x.hits > 0)
    .sort((a,b) => b.hits - a.hits || a.r.minutes - b.r.minutes)
    .slice(0, 4);
}

function recipeLinks(items){
  return items.map(x => ({label: (x.r ? x.r.name : x.name),
                          act: `openRezept('${(x.r || x).id}')`}));
}

/* ---- Die einzelnen Intents ---- */

function ansSubstitute(t){
  // längster passender Schlüssel gewinnt, sonst schluckt "butter" die "buttermilch"
  let hit = null, best = 0;
  SUBS.forEach(s => s.keys.forEach(k => {
    if(matchKey(t, k) && k.length > best){ best = k.length; hit = s; }
  }));
  if(!hit) return null;
  return {text: `**Ersatz für ${hit.name}**\n\n${hit.txt}`, src:'Aus dem Küchenwissen'};
}

function ansCoreTemp(t){
  const hit = CORE_TEMPS.find(c => c.keys.some(k => matchKey(t, k)));
  if(!hit) return null;
  return {text: `**Kerntemperatur ${hit.name}**\n\n${hit.txt}`, src:'Aus dem Küchenwissen'};
}

function ansOven(t){
  let m = t.match(/(\d{2,3})\s*(?:°|grad)?\s*c?.*(umluft)/) || t.match(/(umluft).*?(\d{2,3})/);
  const num = t.match(/(\d{2,3})/);
  const f = t.match(/(\d{3})\s*(?:°\s*)?f(?:ahrenheit)?\b/);
  const gas = t.match(/gas(?:stufe)?\s*(\d)/);

  if(gas){
    const c = OVEN_GAS[parseInt(gas[1],10)];
    if(c) return {text:`**Gasstufe ${gas[1]}** entspricht etwa **${c} °C** Ober-/Unterhitze (Umluft ca. ${c-20} °C).`, src:'Umrechnung'};
  }
  if(f){
    const c = Math.round((parseInt(f[1],10) - 32) * 5/9 / 5) * 5;
    return {text:`**${f[1]} °F** sind etwa **${c} °C**.`, src:'Umrechnung'};
  }
  if(t.includes('umluft') && num){
    const v = parseInt(num[1],10);
    if(t.includes('ober') || t.includes('unterhitze')){
      return {text:`**${v} °C Ober-/Unterhitze** entsprechen etwa **${v-20} °C Umluft**.\n\nUmluft überträgt Hitze durch die bewegte Luft effektiver, deshalb rund 20 °C weniger. Für mehrere Bleche gleichzeitig ist Umluft die bessere Wahl, für Kuchen und Brot Ober-/Unterhitze.`, src:'Umrechnung'};
    }
    return {text:`**${v} °C Umluft** entsprechen etwa **${v+20} °C Ober-/Unterhitze**.`, src:'Umrechnung'};
  }
  if((t.includes('ober') && t.includes('hitze')) && num){
    const v = parseInt(num[1],10);
    return {text:`**${v} °C Ober-/Unterhitze** entsprechen etwa **${v-20} °C Umluft**.`, src:'Umrechnung'};
  }
  return null;
}

function ansConvert(t){
  // "3 EL Mehl in Gramm", "wie viel gramm sind 2 tl zucker"
  const m = t.match(/(\d+[.,]?\d*|eine?n?|halbe)\s*(el|tl|esslöffel|teelöffel|essloeffel|teeloeffel|tassen?)\s*([a-zäöüß]+)?/);
  if(m){
    const word = {'ein':1,'eine':1,'einen':1,'halbe':0.5}[m[1]];
    const n = word !== undefined ? word : parseFloat(m[1].replace(',','.'));
    const unit = m[2];
    const ing = (m[3] || '').replace(/n$/,'');
    const isEL = /el|ess/.test(unit);
    const isCup = /tasse/.test(unit);
    const ml = isCup ? 240 : (isEL ? 15 : 5);
    const key = Object.keys(SPOON_G).find(k => ing && (k.includes(ing) || ing.includes(k)));
    if(key){
      const perEL = SPOON_G[key];
      const g = Math.round(n * perEL * (isCup ? 16 : (isEL ? 1 : 1/3)));
      const unitLabel = isCup ? (n === 1 ? 'Tasse' : 'Tassen') : unit.toUpperCase();
      const ingLabel = key.charAt(0).toUpperCase() + key.slice(1);
      return {text:`**${zahl(n)} ${unitLabel} ${ingLabel}** ≈ **${g} g** (≈ ${Math.round(n*ml)} ml Volumen).\n\nBeim Backen lohnt sich die Waage: Löffelangaben schwanken je nachdem, wie fest man schöpft, um bis zu 30 %.`, src:'Umrechnung'};
    }
    return {text:`**1 EL = 15 ml, 1 TL = 5 ml, 1 Tasse ≈ 240 ml.**\n\nBei ${zahl(n)} ${unit.toUpperCase()} sind das etwa ${Math.round(n*ml)} ml. Für Gramm brauche ich die Zutat – Mehl, Zucker und Öl wiegen bei gleichem Volumen sehr unterschiedlich.`, src:'Umrechnung'};
  }
  if(hasAny(t, ['el ','esslöffel','teelöffel','tl ','tasse'])){
    return {text:'**Löffelmaße**\n\n• 1 EL = 15 ml\n• 1 TL = 5 ml\n• 1 Tasse ≈ 240 ml\n\nIn Gramm (gestrichener EL): Mehl 9 g · Zucker 12 g · Butter 15 g · Öl 13 g · Salz 18 g · Honig 21 g.', src:'Umrechnung'};
  }
  return null;
}

function ansCookWith(t, raw){
  const usePantry = hasAny(t, ['vorrat','vorratsschrank','da habe','zuhause','zu hause']);
  let ings = findIngredients(raw);
  if(usePantry) ings = ings.concat(store.pantry.map(p => p.toLowerCase()));
  if(!ings.length) return null;

  const found = recipesForIngredients(ings);
  if(!found.length){
    return {text:`Zu **${ings.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(', ')}** habe ich kein passendes Rezept in der App.\n\nAus fast allem lässt sich aber etwas bauen: Gemüse aufs Blech mit Öl und Salz, Reste in gebratenen Reis, oder ein Eintopf mit Zwiebel, Dose Tomaten und Hülsenfrüchten.`,
            src:'Aus dem Küchenwissen'};
  }
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  const lines = found.map(x =>
    `• **${x.r.name}** – ${x.hits} passende ${x.hits === 1 ? 'Zutat' : 'Zutaten'}, ${x.r.minutes} Min`).join('\n');
  return {
    text: `Mit **${ings.slice(0,5).map(cap).join(', ')}** passt das hier:\n\n${lines}`,
    links: recipeLinks(found),
    src: 'Aus deinen Rezepten'
  };
}

function ansRecipeSearch(t){
  const hit = alleRezepte().find(r => t.includes(r.name.toLowerCase()) || t.includes(r.id));
  if(!hit) return null;
  return {
    text: `**${hit.name}** – ${hit.minutes} Minuten, ${hit.level.toLowerCase()}, ${hit.base} Portionen.\n\n${hit.desc}\n\nTipp aus dem Rezept: ${hit.tips[0] || '–'}`,
    links: [{label:'Rezept öffnen', act:`openRezept('${hit.id}')`}],
    src: 'Aus deinen Rezepten'
  };
}

function ansProblem(t){
  const problems = [
    {k:['zu dünn','zu duenn','zu flüssig','bindet nicht','dickt nicht'], txt:'**Sauce zu dünn**\n\n• Offen weiter einkochen – am wirksamsten, kostet nur Zeit\n• 1 TL Speisestärke in etwas kaltem Wasser anrühren und in die kochende Sauce geben\n• Kalte Butterwürfel außerhalb der Hitze einrühren – bindet und rundet ab\n• Bei Pastasauce: eine Kelle stärkehaltiges Nudelwasser und kräftig schwenken'},
    {k:['zu salzig','versalzen'], txt:'**Zu salzig**\n\n• Menge vergrößern: mehr Flüssigkeit, Tomaten, Kartoffeln oder Reis dazu\n• Säure und Süße gegensteuern lassen: ein Spritzer Zitrone plus eine Prise Zucker\n• Fett wie Sahne oder Joghurt dämpft die Wahrnehmung\n\nDie rohe Kartoffel als Salzschwamm ist übrigens ein Mythos – sie verdünnt nur.'},
    {k:['zu scharf'], txt:'**Zu scharf**\n\n• Milchprodukte: Joghurt, Sahne, Kokosmilch – Capsaicin ist fettlöslich\n• Etwas Süße (Zucker, Honig) und Säure (Limette)\n• Stärke dazu: Reis, Brot, Kartoffeln\n\nMehr Wasser hilft nicht, es verteilt die Schärfe nur.'},
    {k:['angebrannt','verbrannt'], txt:'**Angebrannt**\n\nInhalt sofort in einen neuen Topf umfüllen, **ohne** den Boden abzukratzen – die verbrannten Stellen bleiben zurück. Dann probieren: Wenn der Rauchgeschmack schon durchgezogen ist, retten auch Säure und Süße nichts mehr.'},
    {k:['klumpen','klümpchen'], txt:'**Klumpen in der Sauce**\n\nDurch ein Sieb passieren oder mit dem Stabmixer glätten. Vorbeugen: gleiche Temperaturen (heiße Flüssigkeit in heiße Mehlschwitze) und Flüssigkeit in kleinen Mengen zugeben, jedes Mal glattrühren.'},
    {k:['fad','langweilig','schmeckt nach nichts','flach'], txt:'**Schmeckt fad**\n\nDer Reihe nach durchgehen:\n1. **Salz** – fast immer der erste Kandidat\n2. **Säure** – Zitrone oder Essig, weckt flache Gerichte sofort\n3. **Umami** – Sojasauce, Tomatenmark, Parmesan, Miso\n4. **Fett** – ein Löffel Butter oder gutes Öl am Ende\n5. **Frische** – Kräuter, Zwiebelringe, Zitronenabrieb\n\nUnd falls alles stimmt: etwas Knuspriges obendrauf.'},
    {k:['kleben','klebt an','pappt'], txt:'**Es klebt an**\n\n• Pfanne leer vorheizen, dann erst Fett dazu\n• Gargut trocken tupfen und nicht zu früh bewegen – bei fertiger Kruste löst es sich von selbst\n• Nicht zu viel auf einmal in die Pfanne, sonst tritt Wasser aus'},
    {k:['zäh','trocken geworden','trockenes fleisch'], txt:'**Fleisch ist zäh oder trocken**\n\nMeist zu heiß oder zu lange gegart. Für kurzgebratenes Fleisch: Kerntemperatur messen und vor dem Ziel vom Herd nehmen, danach ruhen lassen. Zähes Schmorfleisch dagegen braucht das Gegenteil – noch länger bei niedriger Hitze, dann löst sich das Bindegewebe zu Gelatine.'}
  ];
  const hit = problems.find(p => p.k.some(k => /\s/.test(k) ? t.includes(k) : (hasWord(t,k) || hasWordStart(t,k))));
  return hit ? {text: hit.txt, src:'Aus dem Küchenwissen'} : null;
}

function ansTip(t){
  const cat = TIPS.find(x => t.includes(x.cat.toLowerCase()));
  const pool = cat ? TIPS.filter(x => x.cat === cat.cat) : TIPS;
  const p = pool[Math.floor(Math.random() * pool.length)];
  return {text:`**${p.t}**\n\n${p.b}`, links:[{label:'Mehr Tipps', act:"setTab('lernen')"}], src:'Tipp · ' + p.cat};
}

function ansLearn(t){
  const c = COURSES.find(x => t.includes(x.name.toLowerCase().split(' ')[0]) || x.id === t.trim());
  if(c) return {text:`**${c.name}**\n\n${c.desc}\n\n${c.lessons.length} Lektionen und ${c.quiz.length} Quizfragen.`,
                links:[{label:'Kurs öffnen', act:`setTab('lernen');openCourse('${c.id}')`}], src:'Lernbereich'};
  return {text:`Im Lernbereich gibt es ${COURSES.length} Kurse:\n\n${COURSES.map(x => '• ' + x.name + ' – ' + x.desc).join('\n')}`,
          links:[{label:'Zum Lernbereich', act:"setTab('lernen')"}], src:'Lernbereich'};
}

/* Lokale Antwort zusammenstellen */
function localAnswer(raw){
  const t = raw.toLowerCase();

  if(hasAny(t, ['statt ','ersatz','anstelle','ohne ','habe kein','hab kein','keine ']) ){
    const a = ansSubstitute(t); if(a) return a;
  }
  if(hasAny(t, ['kerntemperatur','durchgegart','gar ist','wie heiß','wie heiss','innentemperatur'])){
    const a = ansCoreTemp(t); if(a) return a;
  }
  if(hasAny(t, ['umluft','ober','gasstufe','fahrenheit','°f']) || /\d{2,3}\s*(?:°\s*)?f\b/.test(t) || t.includes('grad')){
    const a = ansOven(t); if(a) return a;
  }
  if(hasAny(t, ['wie viel','wieviel','gramm','umrechn',' el ','esslöffel','teelöffel','tasse'])){
    const a = ansConvert(t); if(a) return a;
  }
  {
    const a = ansRecipeSearch(t); if(a) return a;
  }
  {
    const a = ansProblem(t); if(a) return a;
  }
  if(hasAny(t, ['was kann ich','was koche','ich habe','rezept mit','vorrat','übrig','uebrig','reste'])){
    const a = ansCookWith(t, raw); if(a) return a;
  }
  if(hasAny(t, ['tipp','trick','rat '])) return ansTip(t);
  if(hasAny(t, ['lernen','kurs','technik','üben','ueben'])) return ansLearn(t);
  if(hasAny(t, ['kerntemperatur','temperatur'])){
    const a = ansCoreTemp(t); if(a) return a;
  }
  {
    const a = ansSubstitute(t); if(a) return a;
    const b = ansCookWith(t, raw); if(b) return b;
  }

  return {
    text:'Dabei kann ich helfen:\n\n• **Was koche ich?** – nenn mir Zutaten, ich suche passende Rezepte\n• **Ersatzzutaten** – „Ersatz für Buttermilch“\n• **Umrechnen** – Löffel in Gramm, Umluft, Gasstufen, Fahrenheit\n• **Kerntemperaturen** – Geflügel, Rind, Fisch\n• **Rettung** – zu salzig, zu dünn, angebrannt, fad\n• **Technik** – Kurse zu Messer, Hitze, Würzen, Saucen, Teig',
    links:[{label:'Rezepte ansehen', act:"setTab('rezepte')"}, {label:'Tipp des Tages', act:"setTab('lernen')"}],
    src: store.settings.apiKey ? 'Offline-Wissen' : 'Offline-Wissen · KI-Schlüssel optional in den Einstellungen'
  };
}


/* ==========================================================================
   ASSISTENT
   Offline aus dem eingebauten Wissen. Mit Schlüssel antwortet zusätzlich ein
   Sprachmodell, das den Zusammenhang kennt: Rezept, Portionen, Vorrat, Schritt.
   ========================================================================== */
function aktuellesRezept(){
  if(cook) return rez(aktivesTeil().id);
  if($('vRezept').classList.contains('on') && state.rezeptId) return rez(state.rezeptId);
  return null;
}

function openAssistant(){
  const r = aktuellesRezept();
  if(!state.chat.length){
    state.chat.push({ rolle:'ki', text: r
      ? 'Frag mich, was du zu ' + r.name + ' wissen willst – ich kenne die Zutaten und Schritte.'
      : 'Sag mir, was da ist – ich sage dir, was daraus wird. Oder frag nach Ersatz, Mengen und Temperaturen.' });
  }
  openSheet('Assistent',
    `<button class="btn ghost sm" style="padding:0; color:var(--muted);" onclick="closeSheet()">Fertig</button>`,
    '<div id="chatRaum"></div>',
    `<div style="display:flex; gap:10px; align-items:center;">
       <input class="field" id="chatFeld" placeholder="Frag mich etwas" onkeydown="if(event.key==='Enter')chatSenden()">
       <button class="icon-btn" style="width:46px; height:46px; flex:0 0 46px; background:var(--accent); border-color:var(--accent); color:var(--on-accent);" onclick="chatSenden()" aria-label="Senden">
         <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
       </button>
     </div>`);
  renderChat();
  setTimeout(() => { const f = $('chatFeld'); if(f) f.focus(); }, 120);
}

function fragZuRezept(id){
  state.rezeptId = id;
  openAssistant();
  const f = $('chatFeld');
  if(f){ f.value = 'Frage zu ' + rez(id).name + ': '; f.focus(); }
}

function renderChat(){
  const raum = $('chatRaum');
  if(!raum) return;
  const r = aktuellesRezept();
  const vorschlaege = r
    ? ['Was kann ich statt ' + (r.ings[1] || r.ings[0]).n.split(',')[0] + ' nehmen?', 'Wie wird es cremiger?', 'Für 6 Personen?']
    : ['Was kann ich mit meinem Vorrat kochen?', 'Ersatz für Buttermilch?', 'Wie viel Gramm sind 3 EL Mehl?', 'Meine Sauce ist zu dünn'];

  raum.innerHTML = state.chat.map((m, i) => {
    if(m.tippt) return `<div style="margin-bottom:14px;"><span class="spin"></span></div>`;
    if(m.rolle === 'me') return `<div class="msg me" style="margin-bottom:14px; margin-left:auto; width:fit-content;">${esc(m.text)}</div>`;
    const text = esc(m.text).replace(/\n/g, '<br>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    return `<div style="margin-bottom:16px;">
      <div class="msg">${text}</div>
      ${(m.aktionen || []).map(a => `<button class="act" style="margin-top:9px;" onclick="${a.klick}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" style="flex:0 0 16px;"><path d="M12 5v14M5 12h14"/></svg>
        <span style="flex:1;">${esc(a.label)}</span></button>`).join('')}
      ${(m.links || []).map(l => `<button class="btn sm" style="margin:9px 6px 0 0;" onclick="closeSheet(); ${l.act}">${esc(l.label)}</button>`).join('')}
      ${m.quelle ? `<div class="kicker" style="font-size:9.5px; margin-top:8px;">${esc(m.quelle)}</div>` : ''}
    </div>`;
  }).join('') + `
    <div class="chips" style="margin-top:6px;">
      ${vorschlaege.map(v => `<button class="chip" onclick="chatVorschlag(${JSON.stringify(v).replace(/"/g, '&quot;')})">${esc(v)}</button>`).join('')}
    </div>`;
  const body = $('sheetBody');
  if(body) body.scrollTop = body.scrollHeight;
}

function chatVorschlag(t){ const f = $('chatFeld'); if(f) f.value = t; chatSenden(); }

function chatSenden(){
  const f = $('chatFeld');
  const t = (f.value || '').trim();
  if(!t || state.busy) return;
  f.value = '';
  state.chat.push({ rolle:'me', text:t });
  renderChat();
  chatAntwort(t);
}

/* Steht die Frage im Zusammenhang mit einer Zutat des offenen Rezepts,
   geht sie vor: sonst schlägt die Suche einfach andere Rezepte vor. */
function kontextAntwort(frage){
  const r = aktuellesRezept();
  if(!r) return null;
  const f = frage.toLowerCase();
  if(!/\b(kein\w*|ohne|fehlt|fehlen|statt|ersatz|ersetzen)\b/.test(f)) return null;

  let ing = null;
  r.ings.forEach(i => {
    const n = i.n.toLowerCase().split(',')[0].trim();
    const letztes = n.split(' ').pop();
    if(f.includes(n) || (letztes.length > 3 && f.includes(letztes))) ing = i;
  });
  if(!ing) return null;

  const bekannt = ansSubstitute(ing.n.toLowerCase());
  if(bekannt) return { text: bekannt.text, src: 'Aus dem Küchenwissen' };

  return { text: '**' + ing.n + '** steht in ' + r.name + '. Einen erprobten Ersatz dafür habe ich nicht im eingebauten Wissen.\n\n' +
    'Zwei Wege: weglassen und dafür die kräftigeren Gewürze im Rezept etwas erhöhen – oder auf die Einkaufsliste setzen und heute etwas anderes kochen.' +
    (store.settings.apiKey ? '' : '\n\nMit hinterlegtem KI-Schlüssel beantworte ich solche Fragen frei.'),
    src: 'Aus dem Küchenwissen' };
}

async function chatAntwort(frage){
  state.busy = true;
  state.chat.push({ tippt:true });
  renderChat();

  const lokal = kontextAntwort(frage) || localAnswer(frage);
  let text = lokal.text, quelle = lokal.src, links = lokal.links || [];

  if(store.settings.apiKey){
    try{
      const antwort = await kiFrage(frage, null, 700, systemPrompt());
      if(antwort){ text = antwort; quelle = 'KI-Antwort'; }
    }catch(e){
      text = lokal.text + '\n\n(KI nicht erreichbar: ' + e.message + ' – das hier kommt aus dem eingebauten Wissen.)';
    }
  }

  state.chat = state.chat.filter(m => !m.tippt);
  state.chat.push({ rolle:'ki', text, quelle, links, aktionen: aktionenFuer(frage, text) });
  state.busy = false;
  renderChat();
}

function systemPrompt(){
  const r = aktuellesRezept();
  const teile = [
    'Du bist der Küchen-Assistent der deutschsprachigen App „Kochbuch". Antworte immer auf Deutsch.',
    'Antworte kurz und praktisch, höchstens etwa 120 Wörter, ohne Einleitungsfloskeln.',
    'Erkläre bei Technikfragen kurz das Warum, damit man es übertragen kann.',
    'Bei Fragen zu Garzustand oder Haltbarkeit nenne konkrete Kerntemperaturen oder Zeiten statt „passt schon".',
    'Du kannst nichts in der App verändern – schlage Änderungen vor, der Nutzer bestätigt sie selbst.',
    'Vorrat des Nutzers: ' + (store.pantry.length ? store.pantry.join(', ') : 'nicht angegeben') + '.',
    'Einkaufsliste: ' + (store.shopping.filter(s => !s.done).map(s => s.txt).join(', ') || 'leer') + '.'
  ];
  if(r){
    const faktor = (state.portionen || r.base) / r.base;
    teile.push('Offenes Rezept: ' + r.name + ' für ' + (state.portionen || r.base) + ' Portionen.');
    teile.push('Zutaten (bereits umgerechnet): ' + r.ings.map(i => zutatZeile(i, faktor) + ' ' + i.n).join('; ') + '.');
    teile.push('Schritte: ' + r.steps.map((s, i) => (i + 1) + '. ' + s.t).join(' ') );
    if(cook) teile.push('Der Nutzer kocht gerade und ist bei Schritt ' + (aktivesTeil().idx + 1) + '.');
  }
  return teile.join('\n');
}

/* Vorschläge zum Bestätigen – die App ändert nichts von allein */
function aktionenFuer(frage, antwort){
  const r = aktuellesRezept();
  const aktionen = [];
  const f = frage.toLowerCase();

  // Zutat aus dem Rezept, um die es geht
  let treffer = null, trefferIdx = -1;
  if(r) r.ings.forEach((i, idx) => {
    const n = i.n.toLowerCase().split(',')[0].trim();
    if(n.length > 3 && f.includes(n.split(' ')[0])){ treffer = i; trefferIdx = idx; }
  });

  // gebeugte Formen mitnehmen: kein, keine, keinen, keinem …
  const fehltGefuehl = /\b(kein\w*|fehlt|fehlen|habe? (?:kein|nicht)|ohne)\b/.test(f);

  if(treffer && fehltGefuehl){
    const name = treffer.n.split(',')[0].trim();
    aktionen.push({ label: name + ' auf die Einkaufsliste', klick: `aktionEinkauf(${JSON.stringify(name).replace(/"/g, '&quot;')})` });
    const ersatz = ersatzAusText(antwort);
    if(ersatz) aktionen.push({ label: 'Für heute durch ' + ersatz + ' ersetzen', klick: `aktionErsatz(${trefferIdx}, ${JSON.stringify(ersatz).replace(/"/g, '&quot;')})` });
  }else if(!r && fehltGefuehl){
    const wort = frage.replace(/.*\b(kein\w*|ohne|fehlt|fehlen)\b/i, '').replace(/\b(mehr|da|zuhause|zu hause)\b.*/i, '').trim();
    if(wort && wort.length < 30) aktionen.push({ label: wort + ' auf die Einkaufsliste', klick: `aktionEinkauf(${JSON.stringify(wort).replace(/"/g, '&quot;')})` });
  }

  const port = f.match(/f[üu]r\s+(\d{1,2})\s*(person|leute|portion)/);
  if(port && r) aktionen.push({ label: 'Portionen auf ' + port[1] + ' stellen', klick: `aktionPortionen(${port[1]})` });

  return aktionen;
}

/* Aus der Antwort den vorgeschlagenen Ersatz herausziehen */
function ersatzAusText(text){
  const m = text.match(/(?:nimm|stattdessen|ersetze durch|durch)\s+([^.,;\n]{3,40})/i);
  if(!m) return null;
  return m[1].replace(/^(einfach|dann|etwas|ein|eine|den|die|das)\s+/i, '').trim();
}

function aktionEinkauf(name){
  einkaufHinzu(name, aktuellesRezept() ? aktuellesRezept().name : '');
  renderTabbar();
  toast(name + ' steht auf der Liste');
}
function aktionErsatz(idx, text){
  const r = aktuellesRezept();
  if(!r) return;
  state.ersatz[r.id] = state.ersatz[r.id] || {};
  state.ersatz[r.id][idx] = text;
  toast('Gilt für heute – das Rezept bleibt im Original');
  if($('vRezept').classList.contains('on')) renderRezept();
}
function aktionPortionen(n){
  state.portionen = Math.min(20, Math.max(1, parseInt(n, 10) || 2));
  toast('Portionen auf ' + state.portionen);
  if($('vRezept').classList.contains('on')) renderRezept();
}

/* ==========================================================================
   ERSTER START
   ========================================================================== */
function willkommen(){
  openSheet('Willkommen', '', `
    <div style="font-size:15px; line-height:1.65; color:var(--soft);">
      <p style="margin:0 0 14px;">Kochbuch läuft ohne Internet und ohne Konto. Rezepte, Einkaufsliste, Vorrat und Fortschritt bleiben auf diesem Gerät.</p>
      <p style="margin:0 0 14px;"><b>Ohne weitere Einrichtung</b> kannst du alles nutzen: 16 Rezepte, Kochmodus mit Timer, Wochenplan, Einkaufsliste, Lernkurse und einen Assistenten, der aus eingebautem Küchenwissen antwortet.</p>
      <p style="margin:0 0 14px;"><b>Mit einem eigenen Anthropic-Schlüssel</b> kommen dazu: freie Antworten des Assistenten, Rezepte aus kopiertem Text und aus Screenshots. Der Schlüssel wird nur hier gespeichert.</p>
    </div>
    <input class="field" id="startKey" type="password" placeholder="sk-ant-… (kannst du später eintragen)" autocomplete="off" style="margin-top:16px;">`,
    `<div style="display:flex; gap:9px;">
       <button class="btn" style="flex:1;" onclick="startFertig(false)">Später</button>
       <button class="btn solid" style="flex:1;" onclick="startFertig(true)">Loslegen</button>
     </div>`);
}
function startFertig(mitKey){
  if(mitKey){
    const v = ($('startKey').value || '').trim();
    if(v) store.settings.apiKey = v;
  }
  store.settings.onboarded = true;
  save();
  closeSheet();
  if(mitKey && store.settings.apiKey) toast('Schlüssel gespeichert');
}

/* ==========================================================================
   START
   ========================================================================== */
function init(){
  load();
  applyTheme();
  renderTabbar();
  setTab('heute');

  $('jsonPick').onchange = function(){
    const f = this.files && this.files[0];
    this.value = '';
    if(f) sicherungLesen(f);
  };

  document.addEventListener('keydown', e => {
    if(!$('cook').classList.contains('on')) return;
    if(e.key === 'ArrowRight') cookNext();
    if(e.key === 'ArrowLeft') cookPrev();
    if(e.key === 'Escape') kochenBeenden();
  });

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && cook) wachHalten();
  });

  if(!store.settings.onboarded) setTimeout(willkommen, 400);
}

init();
</script>

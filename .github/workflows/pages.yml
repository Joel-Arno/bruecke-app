name: Nagelstudio veroeffentlichen

on:
  push:
    branches:
      - main
      - claude/clever-shannon-r44d0g
    paths:
      - 'nagelstudio/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages einrichten (aktiviert Pages, falls noch aus)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: App als Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: nagelstudio

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
